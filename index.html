<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Enter</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #000;
      color: #fff;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        sans-serif;

      display: flex;
      justify-content: center;
      align-items: center;

      height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 360px;
      text-align: center;
      padding: 0 20px;
    }

    input {
      width: 100%;
      padding: 12px 16px;

      font-size: 16px;

      border: none;
      border-bottom: 1px solid #333;

      outline: none;

      text-align: center;

      background: transparent;
      color: #fff;

      transition: border-color 0.2s ease;
    }

    input:focus {
      border-bottom-color: #fff;
    }

    .result {
      margin-top: 24px;

      font-size: 15px;
      line-height: 1.5;

      color: #888;

      min-height: 22px;
    }

    video {
      width: 100%;
      max-width: 320px;

      border-radius: 8px;

      margin-bottom: 16px;

      outline: none;
    }
  </style>
</head>

<body>

  <div class="container" id="puzzleBox">

    <input
      type="password"
      id="pass"
      placeholder="Type PIN..."
      autocomplete="off"
      inputmode="numeric"
    />

    <div id="result" class="result"></div>

  </div>

  <script>
    const input = document.getElementById("pass");
    const result = document.getElementById("result");
    const puzzleBox = document.getElementById("puzzleBox");

    /*
      STAGE DATA

      The important information is deliberately
      separated.

      The PIN is NOT stored as "9982".
    */

    const archive = [
      "x", // 0
      "9", // 1
      "x", // 2
      "x", // 3
      "9", // 4
      "x", // 5
      "8", // 6
      "x", // 7
      "x", // 8
      "x", // 9
      "x", // 10
      "2"  // 11
    ];

    /*
      Read these as indexes into archive.

      1 → 9
      4 → 9
      6 → 8
      11 → 2
    */

    const sequence = [1, 4, 6, 11];

    function reveal() {
      return sequence
        .map(index => archive[index])
        .join("");
    }

    function success() {
      puzzleBox.innerHTML = `
        <video
          src="fun.mp4"
          autoplay
          loop
          muted
          playsinline
          style="
            width: 100%;
            max-width: 320px;
            border-radius: 8px;
            margin-bottom: 16px;
            pointer-events: none;
          "
        ></video>

        <div style="
          font-size: 15px;
          letter-spacing: 0.5px;
          color: #fff;
        ">
          wait till the end of the day
        </div>
      `;
    }

    function incorrect() {
      result.textContent = "Incorrect";

      setTimeout(() => {
        result.textContent = "";
      }, 1500);
    }

    input.addEventListener("keypress", function (event) {
      if (event.key !== "Enter") {
        return;
      }

      const value = input.value.trim();

      if (value === reveal()) {
        success();
      } else {
        incorrect();
      }
    });
  </script>

</body>
</html>
