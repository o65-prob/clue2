<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Enter</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .container {
      width: 100%;
      max-width: 360px;
      text-align: center;
      padding: 0 20px;
    }
    input {
      width: 100%;
      padding: 12px 16px;
      font-size: 16px;
      border: none;
      border-bottom: 1px solid #333;
      outline: none;
      text-align: center;
      background: transparent;
      color: #ffffff;
      transition: border-color 0.2s ease;
    }
    input:focus {
      border-bottom-color: #fff;
    }
    .result {
      margin-top: 24px;
      font-size: 15px;
      line-height: 1.5;
      color: #888;
    }
    video {
      width: 100%;
      max-width: 320px;
      border-radius: 8px;
      margin-bottom: 16px;
      outline: none;
    }
  </style>
</head>
<body>
  <div class="container" id="puzzleBox">
    <input 
      type="password" 
      id="pass" 
      placeholder="yo whatsup" 
      autocomplete="off"
    />
    <div id="result" class="result"></div>
  </div>

  <script>
    const input = document.getElementById('pass');
    const result = document.getElementById('result');
    const puzzleBox = document.getElementById('puzzleBox');

    input.addEventListener('keypress', function (e) {
      if (e.key === 'Enter') {
        const value = input.value.trim().toLowerCase();
        
        if (value === '9982') {
          puzzleBox.innerHTML = `
            <video src="fun.mp4" autoplay loop muted playsinline style="width: 100%; max-width: 320px; border-radius: 8px; margin-bottom: 16px; pointer-events: none;"></video>
            <div style="font-size: 15px; letter-spacing: 0.5px; color: #ffffff;">
              wait till the end of the day
            </div>
          `;
        } else {
          result.textContent = 'Incorrect';
          setTimeout(() => { result.textContent = ''; }, 1500);
        }
      }
    });
  </script>
</body>
</html>
